<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background:#FCE4EC; padding:20px; font-family:sans-serif;">
    <h1>Тест MainButton</h1>
    <p>Нажми синюю кнопку внизу</p>
    <script>
        var tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        tg.MainButton.setText('Отправить заказ')
            .show()
            .onClick(function() {
                tg.sendData(JSON.stringify({test: 1, hello: 'world'}));
            });
    </script>
</body>
</html>
