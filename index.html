<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background:#FCE4EC; padding:20px; font-family:sans-serif;">
    <h1>Тест</h1>
    <button onclick="send()" style="width:100%;padding:20px;background:#E91E63;color:white;border:none;border-radius:12px;font-size:18px;">Отправить</button>
    <p id="s" style="margin-top:20px;text-align:center;"></p>
    <script>
        var tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        function send() {
            var txt = 'Version: ' + tg.version + '\n';
            txt += 'Platform: ' + tg.platform + '\n';
            txt += 'isVersionAtLeast 6.1: ' + tg.isVersionAtLeast('6.1');
            document.getElementById('s').textContent = txt;
        }
    </script>
</body>
</html>
