<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background:#FCE4EC; padding:20px; font-family:sans-serif;">
    <h1>Тест</h1>
    <button onclick="send()" style="width:100%;padding:20px;background:#E91E63;color:white;border:none;border-radius:12px;font-size:18px;">Отправить</button>
    <p id="s" style="text-align:center;margin-top:20px;"></p>
    <script>
        var tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        function send() {
            document.getElementById('s').textContent = 'Отправляю...';
            tg.sendData(JSON.stringify({test: 1}));
            document.getElementById('s').textContent = 'Отправлено!';
        }
    </script>
</body>
</html>
